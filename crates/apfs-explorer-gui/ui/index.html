<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAPFS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <h1>OpenAPFS</h1>
        <span id="app-version" class="app-version"></span>
      </div>
      <button id="refresh-btn" class="btn btn-ghost icon-btn" title="Refresh drives" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </header>

    <main class="content">
      <p data-i18n="v0.1 · Read-only access">v0.1 · Read-only access</p>
      <p data-i18n="Unmount before disconnecting.">Unmount before disconnecting.</p>
      <label>Language / 语言 <select id="language"><option value="en">English</option><option value="zh">简体中文</option></select></label>
      <section>
        <h2 class="section-title" data-i18n="Detected drives">Detected drives</h2>
        <div id="detected" class="drive-list">
          <div class="empty" data-i18n="Scanning…">Scanning…</div>
        </div>
      </section>

      <section>
        <h2 class="section-title" data-i18n="Mounted">Mounted</h2>
        <div id="mounted" class="drive-list">
          <div class="empty" data-i18n="Nothing mounted yet.">Nothing mounted yet.</div>
        </div>
      </section>
    </main>

    <footer class="status-bar" id="status-bar" data-i18n="Ready.">Ready.</footer>

    <!-- In-app confirmation modal (replaces the native confirm() chrome). -->
    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h3 id="modal-title" class="modal-title"></h3>
        <p id="modal-message" class="modal-message"></p>
        <div class="modal-actions">
          <button id="modal-cancel" type="button" class="btn btn-outline" data-i18n="Cancel">Cancel</button>
          <button id="modal-confirm" type="button" class="btn btn-primary" data-i18n="Confirm">Confirm</button>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="main.js"></script>
  </body>
</html>
