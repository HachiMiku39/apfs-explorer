name: OpenAPFS Windows artifacts
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows ${{ matrix.arch }} ZIP and MSI
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            dll: winfsp-x64.dll
            python_arch: x64
          - arch: x86
            runner: windows-latest
            target: i686-pc-windows-msvc
            dll: winfsp-x86.dll
            python_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            dll: winfsp-a64.dll
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      WINFSP_DLL_OUTPUT_PATH: ${{ github.workspace }}/target/${{ matrix.target }}/release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
      - name: Test shipping host before packaging
        run: cargo test --locked --target ${{ matrix.target }} -p winfsp-host --test read_only_cli
      - name: Build matching mount helper in GitHub cloud
        run: cargo build --locked --release --target ${{ matrix.target }} -p winfsp-host
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.4
      - name: Build matching GUI and MSI
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'target/${{ matrix.target }}/release'
          $gui = Join-Path $env:GITHUB_WORKSPACE 'crates/apfs-explorer-gui'
          Copy-Item "$out/apfs-mount.exe" "$gui/apfs-mount.exe"
          Copy-Item "$out/${{ matrix.dll }}" "$gui/${{ matrix.dll }}"
          $resources = @{
            'apfs-mount.exe' = 'apfs-mount.exe'
            '../../LICENSE' = 'LICENSE'
            '../../NOTICE.md' = 'NOTICE.md'
            '../../README.md' = 'README.md'
            '../../ARCHITECTURE.md' = 'ARCHITECTURE.md'
            '../../TESTING.md' = 'TESTING.md'
            '../../SECURITY.md' = 'SECURITY.md'
            '../../licenses/WinFsp-2.1.txt' = 'licenses/WinFsp-2.1.txt'
          }
          $resources['${{ matrix.dll }}'] = '${{ matrix.dll }}'
          @{ bundle = @{ resources = $resources } } |
            ConvertTo-Json -Depth 4 | Set-Content "$gui/.openapfs-target.json" -Encoding utf8
          if (Test-Path "$out/bundle/msi") { Remove-Item "$out/bundle/msi" -Recurse -Force }
          Push-Location $gui
          cargo tauri build --target '${{ matrix.target }}' --features custom-protocol --bundles msi --config .openapfs-target.json -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }
          Pop-Location
      - name: Verify EXE and DLL architecture before labelling artifacts
        run: python scripts/verify_windows_arch.py --target ${{ matrix.target }} --directory target/${{ matrix.target }}/release
      - name: Verify actual MSI payload against this build
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'target/${{ matrix.target }}/release'
          $msi = @(Get-ChildItem "$out/bundle/msi" -Filter *.msi)
          if ($msi.Count -ne 1) { throw 'Expected one freshly built MSI' }
          $extract = Join-Path $env:RUNNER_TEMP 'OpenAPFS-msi-payload'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', $msi[0].FullName, '/qn', "TARGETDIR=$extract")
          if ($p.ExitCode -ne 0) { throw "MSI extraction failed: $($p.ExitCode)" }
          $gui = @(Get-ChildItem $extract -Recurse -Filter apfs-explorer.exe)
          if ($gui.Count -ne 1) { throw 'Expected one GUI in MSI' }
          python scripts/verify_msi_payload.py --target '${{ matrix.target }}' --build-dir $out --payload-dir $gui[0].DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'MSI payload verification failed' }
      - name: Package ZIP, MSI, matching source and checksums
        shell: pwsh
        run: |
          $version = (Get-Content crates/apfs-explorer-gui/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stem = "OpenAPFS-$version-windows-${{ matrix.arch }}"
          $out = Join-Path $env:GITHUB_WORKSPACE 'target/${{ matrix.target }}/release'
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          foreach ($name in @('apfs-mount.exe', 'apfs-dump.exe', 'apfs-explorer.exe', '${{ matrix.dll }}')) {
            Copy-Item (Join-Path $out $name) dist/portable
          }
          Copy-Item README.md,ARCHITECTURE.md,TESTING.md,SECURITY.md,LICENSE,NOTICE.md dist/portable
          New-Item -ItemType Directory -Force dist/portable/licenses | Out-Null
          Copy-Item licenses/WinFsp-2.1.txt dist/portable/licenses
          $msi = @(Get-ChildItem "$out/bundle/msi" -Filter *.msi)
          if ($msi.Count -ne 1) { throw 'Expected exactly one freshly built MSI' }
          Copy-Item $msi[0].FullName "dist/$stem.msi"
          Compress-Archive dist/portable/* "dist/$stem.zip"
          git archive --format=zip --output="dist/$stem-source.zip" HEAD
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v7
        with:
          name: OpenAPFS-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
