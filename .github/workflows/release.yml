name: OpenAPFS Windows artifacts
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test shipping host before packaging
        run: cargo test --locked -p winfsp-host --test read_only_cli
      - name: Build mount helper in GitHub cloud
        run: cargo build --locked --release -p winfsp-host
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build GUI and MSI
        shell: pwsh
        run: |
          Copy-Item target/release/apfs-mount.exe crates/apfs-explorer-gui/apfs-mount.exe
          Push-Location crates/apfs-explorer-gui
          cargo tauri build --bundles msi -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }
          Pop-Location
      - name: Package ZIP, MSI, source and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/apfs-mount.exe,target/release/apfs-dump.exe,target/release/apfs-explorer.exe dist/portable
          Copy-Item README.md,ARCHITECTURE.md,TESTING.md,SECURITY.md,LICENSE,NOTICE.md dist/portable
          Copy-Item target/release/bundle/msi/*.msi dist/OpenAPFS-0.1.0-windows-x64.msi
          Compress-Archive dist/portable/* dist/OpenAPFS-0.1.0-windows-x64.zip
          git archive --format=zip --output=dist/OpenAPFS-0.1.0-source.zip HEAD
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v7
        with:
          name: OpenAPFS-0.1.0-windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
