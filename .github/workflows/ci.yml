name: OpenAPFS CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Formatting patch for review
        if: failure()
        run: |
          cargo fmt --all
          git diff -- '*.rs' > rustfmt.patch
          cat rustfmt.patch
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rustfmt-patch
          path: rustfmt.patch
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p apfs-core -p apfs -p winfsp-host --lib
      - run: cargo test --locked -p winfsp-host --test read_only_cli
      - run: cargo test --locked -p apfs-write --lib
  macos-fixtures:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate disposable fixtures with macOS
        run: |
          cargo run --locked -p xtask -- gen-fixture
          cargo run --locked -p xtask -- gen-fixture --large
          test -s tests/fixtures/apfs-tiny.img
          test -s tests/fixtures/apfs-large.img
      - name: Real-image read and checksum tests
        run: |
          cargo test --locked -p apfs-core -p apfs --lib
          cargo test --locked -p apfs --test fsview_real_image fsview_apfs_large_fixture -- --nocapture
          cargo test --locked -p winfsp-host --test gpt_offset_fsview -- --nocapture
      - uses: actions/upload-artifact@v7
        with:
          name: macos-apfs-fixtures
          path: tests/fixtures/*.img
          compression-level: 9
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check licenses
